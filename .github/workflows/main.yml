name: VIREM Backend CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Security & Performance Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: virem_user
          POSTGRES_PASSWORD: virem_password
          POSTGRES_DB: virem_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Load Base Schema
        run: PGPASSWORD=virem_password psql -h localhost -U virem_user -d virem_test_db -f db/esquema_base.sql

      - name: Run Test Suite
        run: |
          node scripts/migrations.js
          node --test tests/security-1e.test.js
          node --test verify-performance-2a.js
          node verify-concurrency-2b.js
        env:
          DATABASE_URL: postgresql://virem_user:virem_password@localhost:5432/virem_test_db
          JWT_SECRET: "test-secret-ci"

  deploy-production:
    name: Deploy to Production
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Production Deploy
        run: |
          echo "Disparando despliegue en el servidor..."
          curl -X POST "${{ secrets.DEPLOY_HOOK_URL }}"